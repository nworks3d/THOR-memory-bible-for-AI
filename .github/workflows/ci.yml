# CI: prove THOR builds and passes its tests on a CLEAN machine - not just on
# the maintainer's. That is the whole point; everything else is style.
#
# Both feature sets are built because both are shipped:
#   default             = pure bm25, no ONNX. What the NAS/server build runs.
#   --features semantic = the dense score-fusion client path.
# A change that only compiles under one of them is broken, so both gate.
#
# NOT gated here (deliberately, so this stays honest rather than decorative):
# rustfmt and clippy. The tree is not currently clean under either, and running
# `cargo fmt` across it would churn every file for no behaviour change. See
# CONTRIBUTING.md - match the local style in your diff instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The server/NAS shape: no ONNX, pure bm25.
          - name: linux / default (bm25)
            os: ubuntu-latest
            features: ""
          # The client shape: the semantic recall path.
          - name: windows / semantic
            os: windows-latest
            features: "--features semantic"
          # Keeps the semantic path honest on Linux too (the courier is not
          # Windows-only); this is what the linux release asset is built from.
          - name: linux / semantic
            os: ubuntu-latest
            features: "--features semantic"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Compiling fastembed/ort/tokenizers/rusqlite from scratch is the slow
      # part; cache keyed on the lockfile so a docs-only PR is fast.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thor

      - name: Build
        working-directory: thor
        run: cargo build --release ${{ matrix.features }}

      # The library suite runs WITHOUT a local embedding model or a daemon (the
      # semantic path degrades to bm25 when they are absent), so a clean runner
      # is a valid place to run it. This step runs across the feature matrix, so
      # there is no single test count: measured 2026-07-21, the default build has
      # 234 tests and the semantic build 280, all passing with no model present.
      - name: Test
        working-directory: thor
        run: cargo test --release ${{ matrix.features }} --lib

  # Version 2, which had NO automated coverage at all until 2026-08-08 - the
  # job above builds `thor/` only, so every one of 2.0's tests ran solely on
  # the maintainer's own machine. A rebuild that nothing tests is a rebuild
  # nobody can trust.
  #
  # `--all-targets`, not `--lib`: 2.0 puts the refusals it cares most about in
  # integration tests (the write path, the neighbourhood toll, the global tier)
  # and those are exactly the ones a regression would break quietly.
  thor2:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The server/NAS shape: no ONNX, so the semantic path degrades to
          # literal search. Everything else has to keep working.
          - name: thor2 / linux (default)
            os: ubuntu-latest
            features: ""
          # The client shape, and the one the owner actually runs.
          - name: thor2 / windows (semantic)
            os: windows-latest
            features: "--features semantic"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thor2

      - name: Build
        working-directory: thor2
        run: cargo build --release ${{ matrix.features }}

      # No embedding model and no store on a clean runner, which is the point:
      # every one of these has to pass without either. Measured 2026-08-08:
      # 1137 tests across 78 binaries.
      - name: Test
        working-directory: thor2
        run: cargo test --release ${{ matrix.features }} --all-targets

  # This repository is public and its test fixtures are written while looking at
  # the maintainer's real, private memory store - so private identifiers leak in
  # by default, not by accident. A full history rewrite on 2026-07-23 scrubbed
  # them; three days later the same class was back. Hence a gate rather than a
  # rule. Cheap, and the only alternative after a push is another rewrite.
  private-data:
    name: no private identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: sh scripts/check-private-data.sh
