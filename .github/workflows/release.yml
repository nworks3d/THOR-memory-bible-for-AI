# Release: tag -> build on clean runners -> attach binaries.
#
# Triggered ONLY by a version tag, so a release always corresponds to an exact
# commit, and the binaries are built by CI on a clean machine - never uploaded
# from a maintainer's laptop, where "works here" proves nothing.
#
# THIS BUILDS VERSION 2, which is a SET of programs rather than one command with
# subcommands, so every asset is a bundle. Version 1 shipped a single `thor`
# binary and its release (tag v1.0.0) stays downloadable from GitHub as it is;
# this workflow no longer builds that shape. Re-cutting a 1.x patch means
# restoring the old job from git history first.
#
# Three assets, because the recall shape is not interchangeable and the client
# shape is built for two platforms:
#   thor2-<ver>-windows-x86_64.zip      - meaning search included. The client build.
#   thor2-<ver>-linux-x86_64.tar.gz     - meaning search included. The client build.
#   thor2-<ver>-linux-x86_64-plain.tar.gz - no meaning search: the server/NAS build.
#
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The programs a user actually needs. The rest of the tree is maintenance and
  # measurement tooling that only makes sense inside a checkout, so it is
  # deliberately NOT shipped: apply_pins, fake_judge, footer_read, import_noise,
  # repair_project, restore_attribution, verify.
  SHIPPED_BINS: install doctor serve mcp codeindex backup sync migrate

jobs:
  # A tag that does not build or does not pass its tests must never become a
  # release. This repeats CI on purpose: tags can be pushed without a green run.
  gate:
    name: gate (build + tests must pass first)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thor2
      - name: Test (whole workspace, every target)
        working-directory: thor2
        run: cargo test --release --workspace --all-targets
      - name: Test (meaning search compiled in)
        working-directory: thor2
        run: cargo test --release --features semantic --lib
      - name: Build (plain - the server shape must keep compiling)
        working-directory: thor2
        run: cargo build --release --workspace

  build:
    name: ${{ matrix.asset }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            features: "--features semantic"
            ext: ".exe"
            asset: thor2-windows-x86_64.zip
          - os: ubuntu-latest
            features: "--features semantic"
            ext: ""
            asset: thor2-linux-x86_64.tar.gz
          - os: ubuntu-latest
            features: ""
            ext: ""
            asset: thor2-linux-x86_64-plain.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thor2

      - name: Build
        working-directory: thor2
        run: cargo build --release --workspace ${{ matrix.features }}

      # Stage into dist/ rather than the repo root: several binary names are
      # also directory names in this tree, and copying to `.` collides.
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          for b in $SHIPPED_BINS; do
            cp "thor2/target/release/$b${{ matrix.ext }}" dist/
          done
          cp LICENSE dist/
          cd dist && 7z a -tzip "../${{ matrix.asset }}" ./*

      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          for b in $SHIPPED_BINS; do
            cp "thor2/target/release/$b" dist/
          done
          cp LICENSE dist/
          tar czf ${{ matrix.asset }} -C dist .

      # Anyone should be able to verify the download matches what CI produced.
      - name: Checksum
        shell: bash
        run: |
          sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256 2>/dev/null \
            || shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          cat ${{ matrix.asset }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -la dist

      # The notes state what the download does NOT include, because that is what
      # generates issues otherwise: no embedding model ships with it, and the
      # meaning-search build needs the MSVC runtime on Windows.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
          body: |
            Built by CI from this tag on clean runners. Verify with the `.sha256` next to each asset.

            **Which download**

            | asset | meaning search | for |
            |---|---|---|
            | `thor2-windows-x86_64.zip` | yes | Windows, the machine your assistant runs on |
            | `thor2-linux-x86_64.tar.gz` | yes | Linux, same |
            | `thor2-linux-x86_64-plain.tar.gz` | no | servers, a NAS, a container |

            Each one is a bundle, not a single program. Version 2 is several small
            programs that work together: `install` sets everything up, `doctor` tells you
            whether it is healthy, and the rest run in the background once installed.

            **What is NOT in the box**

            - **No language model of any kind.** Nothing calls out to an API, nothing needs
              a key. Meaning search needs a local model file (about 235 MB) that you supply;
              nothing downloads itself. Without it, search falls back to matching words and
              keeps working - it does not break.
            - **Windows: you need the Microsoft Visual C++ Redistributable**
              (`MSVCP140.dll`, `VCRUNTIME140.dll`) and `DirectML.dll`, which is already on
              Windows 10 1903 and later. If a program refuses to start, install the VC++
              redistributable first.

            **Install**

            Unpack everything into a folder where it can stay - the setup writes down where
            it put things, so moving the folder afterwards breaks it. Then run `install`,
            pointing it at your assistant's settings file. It backs that file up first and
            only ever adds its own entries. Restart your assistant afterwards: it reads its
            settings once, at startup, so until you restart nothing you installed is
            running. Then run `doctor` to see whether it is actually healthy.

            New here? The README walks through it step by step. Coming from version 1?
            Your old notes are not lost - see the README's own note on that; and version 1's
            documentation is still in `docs/1.0/`.

            **What has actually been run**

            Every asset is built and tested by CI on a clean runner: the whole test suite,
            plus a separate run with meaning search compiled in, plus the plain server
            shape. Beyond that, the maintainer starts the Windows build by hand before
            publishing; the Linux ones are CI-built only. If one does not start for you,
            say so - that is the report worth having.
