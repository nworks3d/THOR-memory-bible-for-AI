[workspace]
resolver = "2"
members = ["core", "intent", "model", "serve", "codeindex", "mcp", "ops"]

# One version for the whole tree. THOR 2.0 ships as a set of programs that
# only make sense together - a store written by one and read by another -
# so a per-crate version would invite a mismatched pair.
[workspace.package]
version = "2.0.0"
edition = "2021"

